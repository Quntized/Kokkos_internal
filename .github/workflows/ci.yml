name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  host-test:
    name: "Build & Test (GCC, Serial+OpenMP)"
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libomp-dev

      - name: Cache dependencies (Kokkos + GTest)
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/kokkos-src
            build/_deps/kokkos-build
            build/_deps/kokkos-subbuild
            build/_deps/googletest-src
            build/_deps/googletest-build
            build/_deps/googletest-subbuild
          key: deps-host-${{ hashFiles('CMakeLists.txt') }}-${{ runner.os }}
          restore-keys: |
            deps-host-${{ hashFiles('CMakeLists.txt') }}-
            deps-host-

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} -S . \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=ON \
            -DKokkos_ENABLE_DEPRECATED_CODE_4=OFF

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }}

      - name: Run tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure --verbose

  cuda-test:
    name: "Build & Test (CUDA 12.6, GPU)"

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (
        contains(github.event.pull_request.labels.*.name, 'gpu-ci') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    runs-on: [self-hosted, gpu, linux]

    environment: gpu

    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
      options: --gpus all

    env:
      BUILD_DIR: build
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake g++ git

      - name: Verify GPU access
        run: nvidia-smi

      - name: Cache dependencies (Kokkos + GTest, CUDA)
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/kokkos-src
            build/_deps/kokkos-build
            build/_deps/kokkos-subbuild
            build/_deps/googletest-src
            build/_deps/googletest-build
            build/_deps/googletest-subbuild
          key: deps-cuda-gpu-${{ hashFiles('CMakeLists.txt') }}-${{ runner.os }}
          restore-keys: |
            deps-cuda-gpu-${{ hashFiles('CMakeLists.txt') }}-
            deps-cuda-gpu-

      - name: Configure CMake (CUDA)
        run: |
          cmake -B ${{ env.BUILD_DIR }} -S . \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_CUDA=ON \
            -DKokkos_ENABLE_DEPRECATED_CODE_4=OFF

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }}

      - name: Run tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure --verbose
