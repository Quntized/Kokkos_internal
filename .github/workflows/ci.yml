name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel in-progress runs for the same branch/PR to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Build & Test (GCC, Serial+OpenMP)"
    runs-on: ubuntu-latest

    env:
      BUILD_DIR: build
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Install system dependencies
      # ------------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libomp-dev

      # ------------------------------------------------------------------
      # 3. Cache the Kokkos FetchContent download & build
      #    Key includes the tag so bumping the version invalidates the cache.
      # ------------------------------------------------------------------
      - name: Cache Kokkos build
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/kokkos-src
            build/_deps/kokkos-build
            build/_deps/kokkos-subbuild
          key: kokkos-${{ hashFiles('CMakeLists.txt') }}-${{ runner.os }}
          restore-keys: |
            kokkos-${{ hashFiles('CMakeLists.txt') }}-
            kokkos-

      # ------------------------------------------------------------------
      # 4. Configure – host-only backends (Serial + OpenMP)
      # ------------------------------------------------------------------
      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} -S . \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=ON \
            -DKokkos_ENABLE_DEPRECATED_CODE_4=OFF

      # ------------------------------------------------------------------
      # 5. Build
      # ------------------------------------------------------------------
      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }}

      # ------------------------------------------------------------------
      # 6. Run tests via CTest
      # ------------------------------------------------------------------
      - name: Run tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure --verbose
